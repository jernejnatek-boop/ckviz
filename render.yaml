# Postavitev na Render (https://render.com)
#
# 1. Na Renderju: New -> Blueprint -> izberi repozitorij jernejnatek-boop/ckviz.
# 2. Render prebere to datoteko in vpraša za ANTHROPIC_API_KEY in HOST_PASSWORD.
# 3. Velik zaslon je nato na https://<ime>.onrender.com/host.html
#
# Brezplačni načrt nima trajnega diska: shranjeni kvizi in zgodovina iger se
# izgubijo ob vsakem ponovnem zagonu, zato je v vmesniku vklopljeno opozorilo
# in gumb "Izvozi". Strežnik uspava po ~15 minutah brez prometa - dokler je
# velik zaslon odprt, promet teče in ne uspava.
#
# Za trajno shranjevanje preklopi na plačljiv načrt in odkomentiraj disk:
#   plan: starter
#   envVars: - key: CKVIZ_DATA_DIR
#              value: /var/data
#   disk:
#     name: ckviz-data
#     mountPath: /var/data
#     sizeGB: 1
services:
  - type: web
    name: ckviz
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Brez trajnega diska - vmesnik naj to pove in ponudi izvoz.
      - key: CKVIZ_EPHEMERAL
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HOST_PASSWORD
        sync: false
