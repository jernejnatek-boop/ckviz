# Postavitev na Render (https://render.com)
#
# 1. Potisni to kodo na GitHub.
# 2. Na Renderju: New -> Blueprint -> izberi ta repozitorij.
# 3. Vpiši ANTHROPIC_API_KEY in HOST_PASSWORD (Render ju vpraša ob prvi postavitvi).
#
# Opomba: trajni disk (spodaj) zahteva plačljiv načrt. Na brezplačnem načrtu
# odstrani razdelek "disk" in "CKVIZ_DATA_DIR" - aplikacija bo delovala,
# a se shranjeni kvizi izgubijo ob vsakem ponovnem zagonu (uporabi Izvozi/Uvozi).
services:
  - type: web
    name: ckviz
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: CKVIZ_DATA_DIR
        value: /var/data
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HOST_PASSWORD
        sync: false
    disk:
      name: ckviz-data
      mountPath: /var/data
      sizeGB: 1
