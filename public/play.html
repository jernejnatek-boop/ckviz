<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#08091a">
<title>CKViz - igraj</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💘</text></svg>">
<link rel="stylesheet" href="/css/app.css">
<style>
  body { padding-bottom: env(safe-area-inset-bottom); }
  .topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: rgba(8,9,26,.82); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.off { background: var(--red); }
  .dot.wait { background: var(--amber); }

  .avatars { display: flex; flex-wrap: wrap; gap: 8px; }
  .av { font-size: 26px; padding: 8px; border-radius: 12px; border: 2px solid transparent; background: rgba(255,255,255,.06); cursor: pointer; }
  .av.sel { border-color: var(--pink); background: rgba(255,77,148,.18); }

  .step { margin-top: 18px; }
  .step.locked { opacity: .35; pointer-events: none; }
  .step-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .step-num { font-size: 11px; font-weight: 900; letter-spacing: .1em; color: var(--muted); }

  .conf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .conf button {
    padding: 12px 6px; border-radius: 13px; border: 2px solid var(--line); cursor: pointer;
    background: rgba(255,255,255,.05); color: var(--txt); font-weight: 800; font-size: 15px;
  }
  .conf button.sel { border-color: var(--amber); background: rgba(251,191,36,.18); color: var(--amber); }
  .conf small { display: block; font-weight: 600; font-size: 10px; color: var(--muted); margin-top: 3px; }
  .conf button.sel small { color: var(--amber); }

  .options.mini { grid-template-columns: 1fr 1fr; gap: 8px; }
  .options.mini .opt { padding: 12px 12px; font-size: 14px; gap: 9px; }
  .options.mini .opt .glyph { width: 26px; height: 26px; flex-basis: 26px; font-size: 12px; }

  .dock {
    position: sticky; bottom: 0; padding: 12px 0 max(12px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 55%, transparent);
  }

  .partner-pick { display: grid; gap: 10px; }
  .pp {
    display: flex; align-items: center; gap: 12px; padding: 13px 15px; border-radius: 15px;
    border: 1px solid var(--line); background: rgba(255,255,255,.05); cursor: pointer; width: 100%;
    color: var(--txt); font-size: 16px; font-weight: 700; text-align: left;
  }
  .pp[disabled] { opacity: .35; }
  .pp .want { margin-left: auto; font-size: 12px; color: var(--pink); font-weight: 800; }

  .mirror { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin-top: 14px; }
  .mirror .side { padding: 14px; border-radius: 15px; background: rgba(255,255,255,.06); border: 1px solid var(--line); text-align: center; }
  .mirror .side b { display: block; font-size: 15px; margin-top: 6px; }
  .mirror .link { font-size: 30px; }

  .answers { display: grid; gap: 10px; margin-top: 14px; }
  .ans { padding: 13px 15px; border-radius: 15px; background: rgba(255,255,255,.06); border: 1px solid var(--line); }
  .ans.mine { border-color: rgba(255,77,148,.45); background: rgba(255,77,148,.10); }
  .ans .who { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .ans p { font-size: 16px; line-height: 1.45; }
  textarea { min-height: 110px; }

  .gain { font-size: 46px; font-weight: 900; letter-spacing: -.03em; }
  .gain.plus { color: var(--ok); }
  .gain.zero { color: var(--muted); }
  .lines { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .lines div { display: flex; justify-content: space-between; font-size: 14px; }
  .lines .v { font-weight: 800; font-variant-numeric: tabular-nums; }

  .reactions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .reactions button { font-size: 24px; padding: 8px 12px; border-radius: 13px; border: 1px solid var(--line); background: rgba(255,255,255,.05); cursor: pointer; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand-mark" style="width:32px;height:32px;font-size:16px;border-radius:10px">💘</div>
  <div class="grow">
    <div style="font-weight:800; font-size:15px" id="tbName">CKViz</div>
    <div class="muted" style="font-size:11px" id="tbSub">povezovanje ...</div>
  </div>
  <div style="text-align:right">
    <div id="tbScore" style="font-weight:900; font-size:18px; font-variant-numeric:tabular-nums">0</div>
    <div class="row" style="gap:5px; justify-content:flex-end"><span class="dot wait" id="tbDot"></span><span class="muted" style="font-size:10px" id="tbNet">...</span></div>
  </div>
</div>

<div class="phone" id="app"></div>

<script type="module" src="/js/play.js"></script>
</body>
</html>
