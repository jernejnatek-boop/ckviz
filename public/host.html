<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08091a">
<title>CKViz - velik zaslon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<link rel="stylesheet" href="/css/app.css">
<style>
  .wrap { padding-bottom: 110px; }
  .grid { display: grid; gap: 18px; }
  .cols-2 { grid-template-columns: 1.25fr .75fr; }
  .cols-3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 1100px) { .cols-2, .cols-3 { grid-template-columns: 1fr; } }

  .code-big {
    font-size: clamp(48px, 7vw, 96px); font-weight: 900; letter-spacing: .12em;
    background: linear-gradient(120deg, #fff, var(--pink) 45%, var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1;
  }
  .qr { background: #fff; padding: 12px; border-radius: 16px; width: 210px; height: 210px; }
  .qr img { width: 100%; height: 100%; display: block; }

  .player-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .pchip {
    display: flex; align-items: center; gap: 9px; padding: 10px 14px; border-radius: 14px;
    background: rgba(255,255,255,.06); border: 1px solid var(--line); font-weight: 700;
    transition: all .25s ease;
  }
  .pchip.paired { border-color: rgba(255,77,148,.55); background: rgba(255,77,148,.12); }
  .pchip.done { border-color: var(--ok); background: rgba(52,211,153,.14); }
  .pchip.off { opacity: .4; }
  .pchip .x { cursor: pointer; opacity: .45; font-size: 13px; }
  .pchip .x:hover { opacity: 1; color: var(--red); }
  .pchip.selectable { cursor: pointer; }
  .pchip.selectable:hover { border-color: var(--line-strong); background: rgba(255,255,255,.10); }
  .pchip.picked {
    border-color: var(--violet); background: rgba(139,92,246,.22);
    box-shadow: 0 0 0 2px rgba(139,92,246,.35);
  }

  .qtext { font-size: clamp(26px, 3.4vw, 52px); font-weight: 900; line-height: 1.15; letter-spacing: -.025em; }
  .opt-big { font-size: clamp(17px, 1.5vw, 24px); padding: 20px 22px; }
  .opt-big .glyph { width: 40px; height: 40px; flex-basis: 40px; font-size: 18px; }

  .dist { display: grid; grid-template-columns: 44px 1fr 46px; gap: 10px; align-items: center; margin-top: 8px; }
  .dist .n { text-align: right; font-weight: 900; font-variant-numeric: tabular-nums; }

  .pairs { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .pair-card { padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,.05); }
  .pair-card.match { border-color: rgba(255,77,148,.6); background: rgba(255,77,148,.12); }
  .pair-card .two { display: flex; align-items: center; gap: 8px; justify-content: space-between; margin-top: 8px; font-size: 13px; }
  .pair-card .g { padding: 6px 8px; border-radius: 10px; background: rgba(0,0,0,.28); flex: 1; text-align: center; font-weight: 700; }

  .open-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .open-ans { padding: 12px 14px; border-radius: 12px; background: rgba(0,0,0,.28); }
  .open-ans .who { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .open-ans p { font-size: 16px; line-height: 1.4; }

  .setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .mode-toggle { display: flex; flex-wrap: wrap; gap: 8px; }
  .mode-toggle button {
    padding: 9px 14px; border-radius: 12px; border: 1px solid var(--line); cursor: pointer;
    background: rgba(255,255,255,.05); color: var(--muted); font-weight: 700; font-size: 14px;
  }
  .mode-toggle button.on { color: var(--txt); border-color: var(--violet); background: rgba(139,92,246,.2); }

  .qlist { max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 6px; }
  .qrow { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line); font-size: 14px; }
  .qrow .del { cursor: pointer; opacity: .4; align-self: center; }
  .wpick { display: flex; gap: 3px; align-self: center; flex: 0 0 auto; }
  .wpick button {
    padding: 4px 7px; font-size: 11px; font-weight: 800; cursor: pointer; color: var(--muted);
    background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 8px;
  }
  .wpick button.on { color: var(--amber); border-color: rgba(251,191,36,.6); background: rgba(251,191,36,.16); }
  .qrow .del:hover { opacity: 1; color: var(--red); }

  .podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: end; }
  .step-box { border-radius: 18px; padding: 18px 14px; text-align: center; border: 1px solid var(--line); background: rgba(255,255,255,.06); }
  .step-box.p1 { background: linear-gradient(160deg, rgba(255,77,148,.30), rgba(139,92,246,.22)); border-color: rgba(255,77,148,.55); padding-bottom: 46px; }
  .step-box.p2 { padding-bottom: 30px; }

  .awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .award { padding: 16px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid var(--line); }

  .ctrlbar {
    position: fixed; right: 20px; bottom: 20px; display: flex; gap: 10px; z-index: 60;
    background: rgba(10,11,28,.9); padding: 10px; border-radius: 18px; border: 1px solid var(--line);
    backdrop-filter: blur(12px); box-shadow: var(--shadow);
  }
  .recap { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .recap-row { padding: 12px 14px; border-radius: 13px; background: rgba(255,255,255,.04); border: 1px solid var(--line); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="ctrlbar" id="ctrl"></div>
<script type="module" src="/js/host.js"></script>
</body>
</html>
